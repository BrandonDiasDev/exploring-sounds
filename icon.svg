<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="128"
   height="128"
   viewBox="0 0 128 128"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg">
  <defs id="defs1" />
  <g id="layer1">
    <!-- Background circle -->
    <circle cx="64" cy="64" r="60" fill="#2a2a3e" id="bg-circle" />
    
    <!-- Grid pattern -->
    <g id="grid">
      <!-- Vertical lines -->
      <line x1="32" y1="32" x2="32" y2="96" stroke="#4a4a6a" stroke-width="2" />
      <line x1="64" y1="32" x2="64" y2="96" stroke="#4a4a6a" stroke-width="2" />
      <line x1="96" y1="32" x2="96" y2="96" stroke="#4a4a6a" stroke-width="2" />
      
      <!-- Horizontal lines -->
      <line x1="32" y1="32" x2="96" y2="32" stroke="#4a4a6a" stroke-width="2" />
      <line x1="32" y1="64" x2="96" y2="64" stroke="#4a4a6a" stroke-width="2" />
      <line x1="32" y1="96" x2="96" y2="96" stroke="#4a4a6a" stroke-width="2" />
    </g>
    
    <!-- Instrument dots (musical notes) -->
    <g id="instruments">
      <!-- Top-left -->
      <circle cx="40" cy="40" r="4" fill="#ff6b6b" />
      <!-- Top-center -->
      <circle cx="64" cy="40" r="4" fill="#4ecdc4" />
      <!-- Middle-right -->
      <circle cx="88" cy="64" r="4" fill="#ffe66d" />
    </g>
    
    <!-- Center emphasis -->
    <circle cx="64" cy="64" r="3" fill="#ffffff" opacity="0.7" />
  </g>
</svg>
